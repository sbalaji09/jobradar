name: LinkedIn check reminder

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminder if within waking hours
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python reminder.py
