name: JobRadar scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: jobradar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan job boards
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scan.py
      - name: Commit state + dashboard data
        run: |
          git config user.name  "jobradar-bot"
          git config user.email "jobradar-bot@users.noreply.github.com"
          git add seen.json docs/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "jobradar: update state [skip ci]"
            git push
          fi
